    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {

        background: #fff;
        color: #161616;
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      .sheet-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        padding: 0.8rem 1.2rem;
        border-bottom: 1px solid #ddd;
      }
      h1 { font-size: 1.4rem; margin: 0; }
      .note { margin: 0; color: #444; }
      button, a.nav {
        font: inherit;
        min-height: 44px;
        padding: 0.4rem 0.8rem;
        border-radius: 8px;
        border: 2px solid #1b4634;
        background: #fff;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: #1b4634; color: #fff; font-weight: 700; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.2rem 1.4rem;
        padding: 1rem 1.2rem 2rem;
      }
      .code {
        border: 1px solid #e6e6e6;
        border-radius: 12px;
        padding: 0.7rem 0.6rem 0.3rem;
        text-align: center;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .bars svg { width: min(100%, 420px); height: auto; }
      .name {
        margin: 0.15rem 0 0.2rem;
        font-size: 3.2rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.04em;
      }
      @media print {
        .sheet-tools { display: none !important; }
        .grid { gap: 0.45rem 0.6rem; padding: 0; }
        .code { border: 0; padding: 0.2rem 0.1rem; }
        .name { font-size: 2.4rem; }
      }
      @page { size: letter; margin: 0.45in; }
    </style>
  </head>
