<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kane's Store 17 Command Center</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: #f3f6f8; background:
      radial-gradient(1100px 420px at 88% -8%, rgba(20, 196, 212, 0.16), transparent 58%),
      radial-gradient(900px 380px at 0% 0%, rgba(24, 58, 120, 0.42), transparent 55%),
      #05080f; }
    button, input { font: inherit; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 10px 14px 36px; }
    h1 { margin: 0; font-size: 34px; color: #7ee7f0; letter-spacing: 0.01em; text-shadow: 0 0 18px rgba(20, 196, 212, 0.28); }
    h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #9eb0c9; }
    .sub { color: #9eb0c9; margin: 4px 0 0; }
    .brand-copy { min-width: 0; flex: 1; }
    .data-refresh { margin-left: 0; flex: 0 1 220px; border: 1px solid #1d5c66; border-radius: 12px; background: rgba(5, 14, 24, 0.78); padding: 6px 8px; }
    .data-refresh-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .data-refresh-title { font-size: 13px; font-weight: 750; color: #f3f6f8; letter-spacing: 0.01em; }
    .data-refresh-sub, .data-refresh-time { margin: 2px 0 0; font-size: 11px; line-height: 1.3; color: #9eb0c9; }
    .data-refresh-state { margin: 4px 0 0; font-size: 13px; font-weight: 750; }
    .data-refresh .dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
    .data-refresh.connected .data-refresh-state { color: #3dde8a; }
    .data-refresh.updating .data-refresh-state { color: #f3d48a; }
    .data-refresh.issue .data-refresh-state { color: #ff8ea3; }
    .data-refresh button { min-height: 28px; padding: 0 8px; border: 1px solid #1d5c66; border-radius: 8px; background: #070b10; color: #7ee7f0; font-size: 12px; font-weight: 700; }

    .logo-login { width: 168px; margin: 0 auto 12px; }

    .brand .logo { width: 86px; position: relative; z-index: 1; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45)); }
    .brand-copy, .hero-side, .hero-meta, .data-refresh, .account { position: relative; z-index: 1; }
    .hero-side { margin-left: auto; width: auto; display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .hero-kicker { display: flex; align-items: center; gap: 8px; }
    .place { color: #d5e4f5; letter-spacing: 0.02em; }
    .hero-meta { margin-left: auto; min-width: 168px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(20, 196, 212, 0.5); background: rgba(5, 14, 24, 0.72); }
    .hero-kicker { margin: 0; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9eb0c9; }
    .hero-date { margin: 2px 0 0; font-size: 18px; font-weight: 750; color: #f4f7f8; }
    .hero-updated { margin: 2px 0 0; font-size: 11px; color: #9eb0c9; }
    .account { min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid #1d5c66; background: #070b10; color: #7ee7f0; font-size: 12px; font-weight: 700; }
    .login { max-width: 440px; margin: 6vh auto; padding: 28px 28px 32px; border: 1px solid #1d5c66; border-radius: 18px; background: #10161c; text-align: center; box-shadow: 0 0 0 1px rgba(24, 196, 214, 0.15), 0 18px 40px rgba(0, 0, 0, 0.35); }
    .login label, .login input, .login .error { text-align: left; }

  <script>
    var token = '';
    var role = '';
    var ownReport = false;
    var screen = 'home';
    var reportQuery = { kind: 'daily', date: '', start: '', end: '', span: 'completed', name: '' };
    var DISPLAY_REFRESH_MS = 30 * 60 * 1000;
    var displayVersion = '';
    var displayStamp = '';
    var displayStale = false;
    var displayTimer = null;
    var displayRefreshing = false;
    var displayHold = false;
    var displayPayload = null;

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
    var salesStandard = 'Store written is NWDSR Net Written. Store delivered is NWDSR Delivered. SNAP Written is a separate reconciliation figure: it can legitimately differ from NWDSR, both are kept, and the variance is shown. Salesperson written sales and goal progress use SNAP Written by salesperson.';
    function standardText(data) { return esc(data && data.standard ? data.standard : salesStandard); }
    function snapReconcile(snapValue, variance) {
      if (snapValue === null || snapValue === undefined) return 'SNAP Written reconciliation Pending.';
      var gap = variance === null || variance === undefined ? 'Pending' : (Number(variance) > 0 ? '+' : '') + money(variance);
      return 'SNAP Written ' + money(snapValue) + ', variance ' + gap + ' vs NWDSR (reconciliation only).';
    }
    function writtenBalanceNote(block, snapValue, variance) {
      if (!block) return snapReconcile(snapValue, variance);
      return 'SNAP Written ' + (block.snap || block.current || 'Pending') + '. NWDSR minus SNAP ' + (block.variance || 'Pending') + '. SNAP Written LAST YEAR ' + (block.ly || 'Pending') + '. NWDSR Written LAST YEAR ' + (block.nwdsrLy || 'Pending') + '.';
    }
    function signedGap(nwdsr, snap) {
      if (nwdsr === null || nwdsr === undefined || nwdsr === '' || snap === null || snap === undefined || snap === '') return 'Pending';
      var gap = Number(nwdsr) - Number(snap);
      if (!isFinite(gap)) return 'Pending';
      return (gap > 0 ? '+' : '') + money(gap);
    }
    function money(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      var number = Number(value);
      var sign = number < 0 ? '-' : '';
      return sign + '$' + Math.abs(Math.round(number)).toLocaleString('en-US');
    }
    function percent(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      return (Number(value) * 100).toFixed(1) + '%';
    }
    function count(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      return String(Math.round(Number(value)));
    }
    function closingBlock(data) {
      var closing = data && data.closing ? data.closing : {};
      return closing.mtd || closing;
    }
    function closingTone(block, goal) {
      if (!block || block.ratio === null || block.ratio === undefined || block.ratio === '') return 'pending';
      if (block.reconcile) return 'warn';
      if (goal === null || goal === undefined || goal === '') return '';
      return Number(block.ratio) >= Number(goal) ? 'good' : 'bad';
    }
    function versusText(block) {
      if (!block || block.versusGoal === null || block.versusGoal === undefined || block.versusGoal === '') return 'Not Available';
      return block.versusGoal;
    }
    function api(name, extra) {
      var payload = Object.assign({ token: token }, extra || {});
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : 'The request failed.'));
        }).dispatch(name, payload);
      });
    }
    function showLogin(message) {
      token = '';
      role = '';
      if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
      sessionStorage.removeItem('cc-token');
      sessionStorage.removeItem('cc-role');
      sessionStorage.removeItem('cc-own-report');
      ownReport = false;
      closeDocViewer();
      docBlobs = {};
      docCache = null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('login-error').textContent = message || '';
    }
    function routeAllowed(name) {
      if (role === 'admin') return true;
      if (role === 'manager') return name !== 'admin' && name !== 'coverage';
      if (name === 'reports') return !!ownReport;
      return name === 'home' || name === 'people' || name === 'morning' || name === 'written' || name === 'delivered' || name === 'closing' || name === 'accel' || name === 'daily' || name === 'documents' || name === 'coach';
    }
    function navModel() {
      var groups = [
        { label: 'Home', screen: 'home' },
        { label: 'Sales Team', screen: 'people' },
        { label: 'Morning Meeting', screen: 'morning' },
        { label: 'Upload Reports', screen: 'upload' },
        { label: 'Sales & KPIs', items: [
          ['written', 'Written'], ['delivered', 'Delivered'], ['closing', 'Closing'], ['bedding', 'Bedding'],
          ['accel', 'Attachments'], ['variance', 'Written Reality'], ['recovery', 'Recovery Simulator'],
          ['leakage', 'Sales Leakage'], ['daily', 'Daily']
        ]},
        { label: 'Reports', items: [
          ['reports:daily', 'Daily'], ['reports:weekly', 'Weekly'], ['reports:monthly', 'Monthly'],
          ['brief', 'Manager Brief'], ['reports:trend', '13-Week Trends'], ['email', 'Morning and MTD Email'],
          ['reports:meeting', 'Monday Meeting Packet'], ['reports:individual', 'Individual']
        ]},
        { label: 'Operations', items: [
          ['readiness', 'Report Readiness'], ['delivery', 'Delivery Rescue'], ['orderQuality', 'Sales Order Quality'],
          ['closeout', 'End-of-Day Closeout'], ['actions', 'Management Actions']
        ]},
        { label: 'Resources', items: [
          ['documents', 'Document Resource Center'], ['training', 'New Hire Training'],
          ['coaching', 'Coaching Tools'], ['evalPrep', 'Evaluation Preparation']
        ]},
        { label: 'Admin', alignEnd: true, items: [
          ['admin', 'Main Administration'], ['health', 'System Health'], ['coverage', 'Data Coverage'],
          ['consistency', 'Data Consistency'], ['email', 'Email Controls']
        ]}
      ];
      return groups.map(function (group) {
        if (group.screen) return routeAllowed(group.screen) ? group : null;
        var items = group.items.filter(function (item) {
          var key = item[0].indexOf('reports:') === 0 ? 'reports' : item[0];
          return routeAllowed(key);
        });
        if (!items.length) return null;
        return { label: group.label, alignEnd: group.alignEnd, items: items };
      }).filter(function (group) { return group; });
    }
    function navTargetCurrent(target) {
      if (target.indexOf('reports:') === 0) return screen === 'reports' && reportQuery.kind === target.slice(8);
      return target === screen;
    }
    function openNavTarget(target) {
      if (target.indexOf('reports:') === 0) {
        reportQuery.kind = target.slice(8);
        if (reportQuery.kind === 'meeting') reportQuery.packet = reportQuery.packet || 'full';
        openScreen('reports');
        return;
      }
      openScreen(target);
    }
    function closeMenus() {
      var nav = document.getElementById('nav');
      if (!nav) return;
      nav.classList.remove('open');
      var burger = document.getElementById('nav-burger');
      if (burger) burger.setAttribute('aria-expanded', 'false');
      var open = nav.querySelectorAll('.menu.open');
      for (var i = 0; i < open.length; i += 1) {
        open[i].classList.remove('open');
        var toggle = open[i].querySelector('.menu-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      }
    }
    var navBound = false;
    function bindNavOnce() {
      if (navBound) return;
      navBound = true;
      document.addEventListener('click', function (event) {
        var burger = event.target.closest && event.target.closest('#nav-burger');
        if (burger) {
          var nav = document.getElementById('nav');
          var opening = !nav.classList.contains('open');
          closeMenus();
          if (opening) {
            nav.classList.add('open');
            burger.setAttribute('aria-expanded', 'true');
          }
          return;
        }
        var toggle = event.target.closest && event.target.closest('#nav .menu-toggle');
        if (toggle) {
          var menu = toggle.parentNode;
          var openingMenu = !menu.classList.contains('open');
          var navOpen = document.getElementById('nav').classList.contains('open');
          closeMenus();
          if (navOpen) document.getElementById('nav').classList.add('open');
          if (openingMenu) {
            menu.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
            var first = menu.querySelector('.menu-panel button');
            if (event.detail === 0 && first) first.focus();
          }
          return;
        }
        var go = event.target.closest && event.target.closest('#nav [data-go]');
        if (go) {
          var target = go.getAttribute('data-go');
          closeMenus();
          openNavTarget(target);
          return;
        }
        if (!(event.target.closest && event.target.closest('#nav'))) closeMenus();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { closeMenus(); return; }
        var panel = document.querySelector('#nav .menu.open .menu-panel');
        if (!panel || (event.key !== 'ArrowDown' && event.key !== 'ArrowUp')) return;
        var items = panel.querySelectorAll('button');
        if (!items.length) return;
        var index = -1;
        for (var i = 0; i < items.length; i += 1) if (items[i] === document.activeElement) index = i;
        event.preventDefault();
        var next = event.key === 'ArrowDown' ? (index + 1) % items.length : (index <= 0 ? items.length - 1 : index - 1);
        items[next].focus();
      });
    }
    function drawNav() {
      bindNavOnce();
      var nav = document.getElementById('nav');
      var row = navModel().map(function (group, index, all) {
        if (group.screen) {
          return '<button type="button" class="nav-link' + (screen === group.screen ? ' current' : '') + '" data-go="' + group.screen + '">' + esc(group.label) + '</button>';
        }
        var current = group.items.some(function (item) { return navTargetCurrent(item[0]); });
        var align = group.alignEnd || index >= all.length - 2 ? ' align-end' : '';
        var panel = group.items.map(function (item) {
          return '<button type="button" class="' + (navTargetCurrent(item[0]) ? 'current' : '') + '" data-go="' + esc(item[0]) + '">' + esc(item[1]) + '</button>';
        }).join('');
        return '<div class="menu' + align + '"><button type="button" class="menu-toggle' + (current ? ' current' : '') + '" aria-expanded="false" aria-haspopup="true">' + esc(group.label) + '</button><div class="menu-panel" role="menu">' + panel + '</div></div>';
      }).join('');
      nav.classList.remove('open');
      nav.innerHTML = '<button type="button" class="nav-burger" id="nav-burger" aria-expanded="false" aria-controls="nav-panel">Menu</button><div class="nav-row" id="nav-panel">' + row + '</div>';
    }
    function card(title, figure, note, tone) {
      return '<article class="card"><h2>' + title + '</h2><p class="figure ' + (tone || '') + '">' + figure + '</p><p class="sub">' + (note || '') + '</p></article>';
    }
    function pendingFigure(value) {
      return value === null || value === undefined || value === '';
    }

    function varianceChart(points) {
      var width = 720;
      var height = 200;
      var left = 8;
      var right = 8;
      var top = 18;
      var bottom = 28;
      var plotW = width - left - right;
      var plotH = height - top - bottom;
      var nums = [0];
      (points || []).forEach(function (point) { if (point.dollars !== null && point.dollars !== undefined) nums.push(Number(point.dollars)); });
      var min = Math.min.apply(null, nums);
      var max = Math.max.apply(null, nums);
      if (max === min) max = min + 1;
      function y(value) { return top + plotH - ((value - min) / (max - min)) * plotH; }
      var zero = y(0);
      var gap = plotW / Math.max((points || []).length, 1);
      var marks = ['<line x1="' + left + '" y1="' + zero.toFixed(1) + '" x2="' + (width - right) + '" y2="' + zero.toFixed(1) + '" stroke="#9eb0c9" stroke-width="1"></line>'];
      (points || []).forEach(function (point, index) {
        var px = left + gap * index + 3;
        var barW = Math.max(gap - 6, 3);
        if (point.dollars === null || point.dollars === undefined) {
          marks.push('<text x="' + (px + barW / 2).toFixed(1) + '" y="' + (zero - 4).toFixed(1) + '" text-anchor="middle" font-size="8" fill="#f3d48a">Pending</text>');
        } else {
          var barY = y(point.dollars);
          var topY = Math.min(barY, zero);
          var barH = Math.max(Math.abs(zero - barY), 1);
          marks.push('<rect x="' + px.toFixed(1) + '" y="' + topY.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" fill="' + (point.large ? '#f3d48a' : '#14c4d4') + '"></rect>');
        }
        marks.push('<text x="' + (px + barW / 2).toFixed(1) + '" y="' + (height - 8) + '" text-anchor="middle" font-size="8" fill="#9eb0c9">' + esc(point.label || '') + '</text>');
      });
      return '<svg class="var-chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Daily NWDSR minus SNAP">' + marks.join('') + '</svg>';

          '<h2 style="margin-top:14px">Not in the packet</h2>' +
          (others.length ? '<ul class="doc-links doc-order">' + others.map(function (doc) {
            return '<li><input type="checkbox" data-setup-toggle="' + esc(doc.id) + '" aria-label="Approve: ' + esc(doc.title) + '" /><span style="flex:1">' + esc(doc.title) + ' <span class="doc-meta">' + esc(docMeta(doc)) + '</span></span></li>';
          }).join('') + '</ul>' : '<p class="doc-empty">No other printable New Hire documents are visible to all staff.</p>') +
          '<p class="summary-actions"><button type="button" id="setup-save">Save packet</button></p></div>';
        Array.prototype.forEach.call(body.querySelectorAll('[data-setup-toggle]'), function (box) {
          box.addEventListener('change', function () {
            var id = box.getAttribute('data-setup-toggle');
            if (box.checked && order.indexOf(id) === -1) order.push(id);
            if (!box.checked) order = order.filter(function (other) { return other !== id; });
            draw();
          });
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-setup-move]'), function (button) {
          button.addEventListener('click', function () {
            var at = order.indexOf(button.getAttribute('data-id'));
            var to = at + Number(button.getAttribute('data-setup-move'));
            if (at < 0 || to < 0 || to >= order.length) return;
            order.splice(to, 0, order.splice(at, 1)[0]);
            draw();
          });
        });
        document.getElementById('setup-save').addEventListener('click', function () { docAdminCall('saveDocPacket', { ids: order }, ''); });
      };
      draw();
    }
    /* display-refresh-policy */
    function displayRefreshPlan(state) {
      if (state.failed) return { redraw: false, stale: true, stamp: false, defer: false };
      if (state.weakened) return { redraw: false, stale: true, stamp: false, defer: false };
      if (state.busy) return { redraw: false, stale: false, stamp: false, defer: true };
      if (!state.manual && !state.changed) return { redraw: false, stale: false, stamp: true, defer: false };
      return { redraw: true, stale: false, stamp: true, defer: false };
    }
    function figuresWeakened(previous, next) {
      if (!previous) return false;
      if (!next || typeof next !== 'object') return true;
      var weakened = false;
      function hasNumber(value) {
        if (typeof value === 'number' && isFinite(value)) return true;
        if (!value || typeof value !== 'object') return false;
        var keys = Object.keys(value);
        for (var i = 0; i < keys.length; i += 1) if (hasNumber(value[keys[i]])) return true;
        return false;
      }
      function walk(before, after) {
        if (weakened || before === null || before === undefined || Array.isArray(before) || typeof before !== 'object') return;
        Object.keys(before).forEach(function (key) {
          if (weakened) return;
          var left = before[key];
          if (typeof left === 'number' && isFinite(left)) {
            if (!after || typeof after !== 'object' || after[key] === null || after[key] === undefined || after[key] === '') weakened = true;
            return;
          }
          if (!left || typeof left !== 'object' || Array.isArray(left)) return;
          if (!after || typeof after !== 'object' || !Object.prototype.hasOwnProperty.call(after, key)) {
            if (hasNumber(left)) weakened = true;
            return;
          }
          walk(left, after[key]);
        });
      }
      walk(previous, next);
      return weakened;
    }
    /* end-display-refresh-policy */
    function displayClock(date) {
      try {
        return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(date) + ' ET';
      } catch (ignore) {
        return date.toISOString();
      }
    }
    function paintDisplayStatus(mode) {
      var box = document.getElementById('data-refresh');
      var state = document.getElementById('display-state');
      var time = document.getElementById('display-time');
      if (!box || !state) return;
      var kind = mode === 'updating' ? 'updating' : (mode === 'issue' || displayStale ? 'issue' : 'connected');
      var label = kind === 'updating' ? 'Updating' : (kind === 'issue' ? 'Connection Issue' : 'Connected');
      box.className = 'data-refresh noprint ' + kind;
      state.textContent = label;
      if (time) time.textContent = displayStamp ? 'Last success ' + displayStamp : '';
    }
    function displayBusy() {
      if (uploadBusy) return true;
      if (screen === 'upload' && uploadFiles && uploadFiles.length) return true;
      if (displayHold) return true;
      var viewer = document.getElementById('doc-viewer');
      if (viewer && !viewer.classList.contains('hidden')) return true;
      if (document.getElementById('eval-editor')) return true;
      if (screen === 'brief' || screen === 'admin' || screen === 'documents' || screen === 'upload') return true;
      if (screen === 'coach' && coachDirty) return true;
      if (screen === 'recovery' && recoveryDirty) return true;
      var pillow = document.getElementById('pillow-goal');
      if (pillow && String(pillow.value || '').trim()) return true;
      var active = document.activeElement;
      if (active && active.id !== 'display-refresh' && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return true;
      var body = document.body;
      if (body.classList.contains('print-brief') || body.classList.contains('print-eval') || body.classList.contains('print-doc') || body.classList.contains('print-summary') || body.classList.contains('print-coach') || body.classList.contains('print-mtd') || body.classList.contains('print-evalprep') || body.classList.contains('print-actions') || body.classList.contains('print-report') || body.classList.contains('print-variance') || body.classList.contains('print-order') || body.classList.contains('print-closeout') || body.classList.contains('print-training')) return true;
      return false;
    }
    function syncRefreshButton() {
      var button = document.getElementById('display-refresh');
      if (button) button.classList.remove('hidden');
    }
    function renderConsistency(data) {
      var tone = data.status === 'PASS' ? 'good' : (data.status === 'FAIL' ? 'bad' : '');
      function line(label, value) { return '<p><strong>' + esc(label) + '</strong> <span class="' + (value === 'PASS' ? 'good' : (value === 'FAIL' ? 'bad' : '')) + '">' + esc(value || 'WARNING') + '</span></p>'; }
      var metrics = (data.metrics || []).map(function (metric) {
        var value = metric.value === null || metric.value === undefined ? 'Pending' : (metric.id.indexOf('closing') !== -1 ? percent(metric.value) : money(metric.value));
        var extra = metric.customers !== undefined && metric.customers !== null ? ' · ' + count(metric.customers) + ' customers / ' + count(metric.opportunities) + ' opportunities' : '';
        return '<li><strong>' + esc(metric.id.replace(/_/g, ' ')) + '</strong> ' + esc(value) + esc(extra) + '<br><span class="sub">' + esc(metric.source) + ' · ' + esc(metric.scope) + ' · ' + esc(metric.periodStart) + ' through ' + esc(metric.periodEnd) + ' · through ' + esc(metric.verifiedThrough) + ' · ' + esc(metric.completeness) + '</span></li>';
      }).join('');
      var findings = (data.findings || []).map(function (row) {
        return '<li class="' + (row.status === 'FAIL' ? 'bad' : '') + '"><strong>' + esc(row.status) + ' · ' + esc(row.page) + ' · ' + esc(row.metric) + '</strong><br>' + esc(row.expected) + ' expected, ' + esc(row.actual) + ' displayed. ' + esc(row.reason) + '</li>';
      }).join('');
      var history = (data.runs || []).map(function (run) {
        return '<li>' + esc(run.at) + ' · ' + esc(run.status) + ' · ' + esc(String(run.matched)) + ' of ' + esc(String(run.checked)) + ' matched · ' + esc(String(run.discrepancies)) + ' discrepancies · ' + esc(run.trigger) + '</li>';
      }).join('');
      var flags = (data.qualityFlags || []).map(function (row) { return '<li class="bad"><strong>' + esc(row.subject) + '</strong><br>' + esc(row.explanation) + '</li>'; }).join('');
      var periods = (data.periods || []).map(function (row) { return '<li><strong>' + esc(row.name) + ' · ' + esc(row.status) + '</strong><br><span class="sub">' + esc(row.periodDates) + ' · ' + esc(row.explanation) + '</span></li>'; }).join('');
      document.getElementById('screen').innerHTML = '<article class="card"><p class="ready-label">Data integrity</p><h2 class="' + tone + '">' + esc(data.status || 'WARNING') + '</h2>' + line('Cross-page consistency', data.consistency || data.status) + line('Source data integrity', data.integrity) + line('Reporting completeness', data.completeness) + '<p>' + esc(data.notice || '') + '</p><p class="' + (data.stale ? 'bad' : 'sub') + '">' + esc(data.staleText || (data.last ? 'Last audit ' + data.last.at + '.' : '')) + '</p><p class="sub">' + esc(data.last ? (data.last.matched + ' of ' + data.last.checked + ' matching results · ' + data.last.discrepancies + ' discrepancies') : 'Run a check to compare every matching screen.') + '</p><div class="ready-actions"><button type="button" id="consist-run">Run Consistency Check</button></div><p id="consist-error" class="error"></p></article>' +
        '<article class="card"><h2>Canonical figures</h2>' + (data.metricError ? '<p class="bad">' + esc(data.metricError) + '</p>' : '') + (metrics ? '<ul class="list">' + metrics + '</ul>' : '<p>Canonical figures appear after the page loads the shared metric service.</p>') + '</article>' +
        '<article class="card"><h2>Source flags</h2>' + (flags ? '<ul class="list">' + flags + '</ul>' : '<p>No source-data flag is open.</p>') + (periods ? '<h2>Reporting periods</h2><ul class="list">' + periods + '</ul>' : '') + '</article>' +
        '<article class="card"><h2>Cross-page discrepancies</h2>' + (findings ? '<ul class="list">' + findings + '</ul>' : '<p>No open discrepancy is on the latest consistency audit.</p>') + '</article>' +
        '<article class="card"><h2>Audit history</h2>' + (history ? '<ul class="list">' + history + '</ul>' : '<p>No audit has been saved.</p>') + '</article>';
      document.getElementById('consist-run').addEventListener('click', function () {
        var button = document.getElementById('consist-run');
        button.disabled = true;
        document.getElementById('consist-error').textContent = 'Checking every matching screen…';
        api('runConsistency').then(function (page) {
          if (screen !== 'consistency') return;
          displayPayload = page;
          renderConsistency(page);
        }).catch(function (error) {
          var note = document.getElementById('consist-error');
          if (note) note.textContent = error.message;
          if (button) button.disabled = false;
        });
      });
    }
    function applyScreenData(name, data) {
      if (name === 'home' || name === 'written' || name === 'delivered') renderHome(data, name);
      else if (name === 'bedding') renderBedding(data);
      else if (name === 'delivery') renderDelivery(data);
      else if (name === 'accel') renderAccelerator(data);
      else if (name === 'actions') renderActions(data);
      else if (name === 'reports') renderReports(data);
      else if (name === 'daily') renderDaily(data);
      else if (name === 'closing') renderClosing(data);
      else if (name === 'people') renderPeople(data);
      else if (name === 'coach') renderCoach(data);
      else if (name === 'recovery') renderRecovery(data);
      else if (name === 'coaching') renderCoaching(data);
      else if (name === 'evalPrep') renderEvalPrep(data);
      else if (name === 'leakage') renderLeakage(data);
      else if (name === 'morning') renderMorning(data);
      else if (name === 'brief') renderBrief(data);
      else if (name === 'health') renderHealth(data);
      else if (name === 'readiness') renderReadiness(data);
      else if (name === 'variance') renderVariance(data);
      else if (name === 'orderQuality') renderOrderQuality(data);
      else if (name === 'closeout') renderCloseout(data);
      else if (name === 'training') renderTraining(data);
      else if (name === 'consistency') renderConsistency(data);
      else if (name === 'email') renderEmail(data);
      else if (name === 'coverage') renderCoverage(data);
    }
    function reloadCurrentScreen() {
      var name = screen;
      var request = name === 'written' || name === 'delivered' ? 'home' : (name === 'email' ? 'emailControl' : name);
      if (name === 'admin' || name === 'documents' || name === 'upload') return Promise.resolve({ applied: false, busy: true });
      return api(request, name === 'reports' ? reportRequest() : undefined).then(function (data) {
        if (screen !== name || displayHold || displayBusy()) return { applied: false, busy: true };
        if (figuresWeakened(displayPayload, data)) return { applied: false, weakened: true };
        displayPayload = data;
        applyScreenData(name, data);
        return { applied: true };
      });
    }
    function refreshDisplayed(manual) {
      if (!token || displayRefreshing) return;
      syncRefreshButton();
      var plan = displayRefreshPlan({ failed: false, weakened: false, busy: displayBusy(), manual: !!manual, changed: false });
      if (plan.defer) return;
      displayRefreshing = true;
      paintDisplayStatus('updating');
      api('dataPulse').then(function (pulse) {
        if (!pulse || pulse.ok === false) {
          displayStale = true;
          paintDisplayStatus('issue');
          return null;
        }
        var changed = !!(displayVersion && pulse.version !== displayVersion);
        var next = displayRefreshPlan({ failed: false, weakened: false, busy: displayBusy(), manual: !!manual, changed: changed });
        if (next.defer) { paintDisplayStatus(displayStale ? 'issue' : 'connected'); return null; }
        if (!next.redraw) {
          displayVersion = pulse.version || displayVersion;
          displayStale = false;
          if (next.stamp) displayStamp = displayClock(new Date());
          paintDisplayStatus('connected');
          return null;
        }
        return reloadCurrentScreen().then(function (result) {
          if (result && result.applied) {
            displayVersion = pulse.version || displayVersion;
            displayStamp = displayClock(new Date());
          }
          displayStale = false;
          paintDisplayStatus('connected');
        });
      }).catch(function (error) {
        if (/sign in/i.test(error.message)) showLogin(error.message);
        else { displayStale = true; paintDisplayStatus('issue'); }
      }).then(function () { displayRefreshing = false; });
    }
    function startDisplayRefresh() {
      syncRefreshButton();
      if (displayTimer) return;
      refreshDisplayed(false);
      displayTimer = setInterval(function () { refreshDisplayed(false); }, DISPLAY_REFRESH_MS);
    }
    function openScreen(name) {
      screen = name;
      displayHold = false;
      document.body.classList.remove('print-summary', 'print-eval', 'print-doc', 'print-brief', 'print-coach', 'print-evalprep', 'print-actions', 'print-report');
      closeDocViewer();
      drawNav();
      var request = name === 'written' || name === 'delivered' ? 'home' : (name === 'email' ? 'emailControl' : name);
      if (name === 'admin') { renderAdmin(); return; }
      if (name === 'documents') {
        docNotice = null;
        document.getElementById('screen').innerHTML = '<p class="sub">Loading documents…</p>';
        api('documents').then(function (data) { renderDocs(data); }).catch(docFailed);
        return;
      }
      if (name === 'upload') {
        uploadFiles = [];
        uploadResults = [];
        document.getElementById('screen').innerHTML = '<p class="sub">Loading the report checklist…</p>';
        loadUploads(uploadCache ? uploadCache.date : '', false).catch(uploadFailed);
        return;
      }
      api(request).then(function (data) {
        // A slow reply for a screen the user already left must not draw over the current one.
        if (screen !== name || displayHold) return;
        displayPayload = data;
        applyScreenData(name, data);
      }).catch(function (error) {
        if (/sign in/i.test(error.message)) showLogin(error.message);
        else if (screen === name) document.getElementById('screen').innerHTML = '<p class="error">' + error.message + '</p>';
      });
    }
    document.getElementById('signin').addEventListener('click', function () {
      document.getElementById('login-error').textContent = '';
      api('login', { username: document.getElementById('username').value, password: document.getElementById('password').value }).then(function (result) {
        token = result.token;
        role = result.role;
        ownReport = !!result.ownReport;
        sessionStorage.setItem('cc-token', token);
        sessionStorage.setItem('cc-role', role);
        if (ownReport) sessionStorage.setItem('cc-own-report', '1');
        else sessionStorage.removeItem('cc-own-report');
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        openScreen('home');
        startDisplayRefresh();
      }).catch(function (error) { document.getElementById('login-error').textContent = error.message; });
    });
    document.getElementById('display-refresh').addEventListener('click', function () { refreshDisplayed(true); });
    document.getElementById('account-out').addEventListener('click', function () { showLogin(''); });
    token = sessionStorage.getItem('cc-token') || '';
    role = sessionStorage.getItem('cc-role') || '';
    ownReport = sessionStorage.getItem('cc-own-report') === '1';
    if (token && role) {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      openScreen('home');
      startDisplayRefresh();
    }
  </script>
