<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kane's Store 17 Command Center</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: #05080c; color: #f3f6f8; }
    button, input { font: inherit; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { margin: 0; font-size: 30px; color: #f4f7f8; letter-spacing: 0.01em; }
    h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #9eb0c9; }
    .sub { color: #9eb0c9; margin: 4px 0 0; }
    .logo { display: block; height: auto; }
    .logo-login { width: 168px; margin: 0 auto 12px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .logo { width: 72px; }
    .login { max-width: 440px; margin: 6vh auto; padding: 28px 28px 32px; border: 1px solid #1d5c66; border-radius: 18px; background: #10161c; text-align: center; box-shadow: 0 0 0 1px rgba(24, 196, 214, 0.15), 0 18px 40px rgba(0, 0, 0, 0.35); }
    .login label, .login input, .login .error { text-align: left; }
    label { display: block; margin: 14px 0 6px; color: #9eb0c9; }
    input { width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid #1d5c66; background: #070b10; color: white; }
    button { min-height: 46px; padding: 0 16px; border: 0; border-radius: 10px; background: #14c4d4; color: #041014; font-weight: 700; cursor: pointer; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .nav button { background: #10161c; border: 1px solid #1d5c66; color: #f3f6f8; }
    .nav button.active { background: #14c4d4; color: #041014; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { border: 1px solid #1d5c66; border-radius: 14px; padding: 14px 16px; background: #10161c; }
    .figure { font-size: 40px; font-weight: 750; line-height: 1; margin: 8px 0; }
    .good { color: #3dde8a; }
    .bad { color: #ff8ea3; }
    .warn { color: #f3d48a; }
    .muted { color: #d5e4f5; font-size: 28px; }
    .error { color: #ffb4c0; min-height: 1.2em; }
    .list { margin: 8px 0 0; padding-left: 18px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #1d5c66; }
    .hidden { display: none; }
    .section-title { margin: 22px 0 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #14c4d4; }
    .bedding-page { border-top: 3px solid #14c4d4; padding-top: 8px; }
    .bedding-page .section-title { color: #f3d48a; }
    .bedding-band article { border-top: 3px solid #1d5c66; }
    .kpi-wrap { overflow-x: auto; }
    table.kpi { min-width: 680px; }
    table.kpi td, table.kpi th { white-space: nowrap; }
    .pending { color: #9eb0c9; }
    .score-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
    .score-row .card { min-height: 132px; display: flex; flex-direction: column; }
    .score-row .card h2 { min-height: 2.4em; }
    .score-row .figure { font-size: 32px; margin: 6px 0; }
    .score-row .sub { font-size: 14px; }
    .kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .kpi-head .section-title { margin: 0; }
    .kpi-nav { display: flex; gap: 8px; }
    .kpi-nav button { min-height: 40px; }
    .kpi-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 12px; }
    .kpi-card { flex: 0 0 220px; scroll-snap-align: start; border: 1px solid #1d5c66; border-radius: 14px; background: #10161c; padding: 12px 14px; min-height: 158px; }
    .kpi-card h3 { margin: 0; min-height: 2.6em; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #9eb0c9; }
    .kpi-card .figure { font-size: 30px; font-weight: 750; line-height: 1; margin: 8px 0; }
    @media (max-width: 980px) {
      .score-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .score-row { grid-template-columns: 1fr; }
      .kpi-head { align-items: flex-start; flex-direction: column; }
    }
    button.sort { background: #10161c; border: 1px solid #1d5c66; color: #f3f6f8; }
    button.sort.active { background: #14c4d4; color: #041014; }
    button.linkish { background: transparent; border: 0; color: #7ee7f0; min-height: 0; padding: 0; font-weight: 700; cursor: pointer; }
    @media (max-width: 720px) {
      h1 { font-size: 24px; }
      .figure { font-size: 32px; }
      .brand { align-items: flex-start; }
    }
    button, input, textarea { font: inherit; }
    textarea { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid #1d5c66; background: #070b10; color: white; }
    .morning .figure { font-size: 32px; }
    .morning-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .morning-five { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
    .morning-five .card { display: flex; flex-direction: column; min-width: 0; }
    .morning-five .card h2 { min-height: 2.4em; }
    .morning-five .figure { font-size: 32px; }
    .morning-five .sub { font-size: 14px; }
    .morning-five .awaiting { font-size: 16px; font-weight: 650; line-height: 1.25; margin: 8px 0; color: #9eb0c9; }
    .promo-hero { border-color: #f3d48a; }
    .promo-hero .figure { color: #f3d48a; }
    @media (max-width: 980px) {
      .morning-five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .morning-grid, .morning-five { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: white; color: black; }
      .nav, .noprint, .login { display: none !important; }
      .card { break-inside: avoid; border-color: #ccc; background: white; }
      h1, h2, .sub { color: black; }
      .good { color: #0b6b3a; }
      .bad { color: #9b1c33; }
      .pending, .warn { color: #444; }
      .promo-hero { border-color: #111; }
      .promo-hero .figure { color: black; }
      .morning .card { padding: 8px 10px; }
      .morning .section-title { margin: 10px 0 6px; }
      .morning .figure { font-size: 22px; }
      .morning .sub, .morning .list { font-size: 12px; }
      .morning-five .awaiting { color: #444; font-size: 12px; }
      .morning-finance { break-before: page; }
    }
  </style>
</head>

        <div>
          <h1>Kane's Store 17 Command Center</h1>
          <p class="sub" id="header-note"></p>
        </div>
      </header>
      <nav class="nav noprint" id="nav"></nav>
      <div id="screen"></div>
    </section>
  </main>
  <script>
    var token = '';
    var role = '';
    var screen = 'home';

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
    var salesStandard = 'SNAP written is the actual written sales. NWDSR delivered is the delivered standard. NWDSR written is what was written and may be unpaid or cancelled. SNAP delivered is not used.';
    function money(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      var number = Number(value);
      var sign = number < 0 ? '-' : '';
      return sign + '$' + Math.abs(Math.round(number)).toLocaleString('en-US');
    }
    function percent(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      return (Number(value) * 100).toFixed(1) + '%';
    }
    function count(value) {
      if (value === null || value === undefined || value === '') return 'Not Available';
      return String(Math.round(Number(value)));
    }
    function closingBlock(data) {
      var closing = data && data.closing ? data.closing : {};
      return closing.mtd || closing;
    }
    function closingTone(block, goal) {
      if (!block || block.ratio === null || block.ratio === undefined || block.ratio === '') return 'pending';
      if (block.reconcile) return 'warn';
      if (goal === null || goal === undefined || goal === '') return '';
      return Number(block.ratio) >= Number(goal) ? 'good' : 'bad';
    }
    function versusText(block) {
      if (!block || block.versusGoal === null || block.versusGoal === undefined || block.versusGoal === '') return 'Not Available';
      return block.versusGoal;
    }
    function api(name, extra) {
      var payload = Object.assign({ token: token }, extra || {});
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : 'The request failed.'));
        }).dispatch(name, payload);
      });
    }
    function showLogin(message) {
      token = '';
      role = '';
      sessionStorage.removeItem('cc-token');
      sessionStorage.removeItem('cc-role');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('login-error').textContent = message || '';
    }
    function navItems() {
      var items = [['home', 'Home'], ['daily', 'Daily'], ['written', 'Written'], ['delivered', 'Delivered'], ['people', 'Salespeople'], ['morning', 'Morning meeting']];
      if (role !== 'sales') items.push(['bedding', 'Bedding'], ['orders', 'Open orders'], ['health', 'System health']);
      if (role === 'admin') items.push(['coverage', 'Data coverage'], ['admin', 'Admin']);
      return items;
    }
    function drawNav() {
      var nav = document.getElementById('nav');
      nav.innerHTML = '';
      navItems().forEach(function (item) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = item[1];
        if (item[0] === screen) button.className = 'active';
        button.addEventListener('click', function () { openScreen(item[0]); });
        nav.appendChild(button);
      });
      var out = document.createElement('button');
      out.type = 'button';
      out.textContent = 'Log out';
      out.addEventListener('click', function () { showLogin(''); });
      nav.appendChild(out);
    }
    function card(title, figure, note, tone) {
      return '<article class="card"><h2>' + title + '</h2><p class="figure ' + (tone || '') + '">' + figure + '</p><p class="sub">' + (note || '') + '</p></article>';
    }
    function toneFor(actual, goal) {
      if (actual === null || actual === undefined || goal === null || goal === undefined || goal === '') return 'pending';
      var value = Number(actual);
      var target = Number(goal);
      if (value >= target) return 'good';
      if (value >= target * 0.9) return 'warn';
      return 'bad';
    }
    function kpiText(value, unit) {
      if (value === null || value === undefined || value === '') return 'Data Pending';
      if (unit === 'percent') return percent(value);
      if (unit === 'dollars') return money(value);
      return String(value);
    }
    function goalText(value, unit) {
      if (value === null || value === undefined || value === '') return 'Not configured';
      return kpiText(value, unit);
    }
    function statusText(actual, goal) {
      if (actual === null || actual === undefined || actual === '') return 'Data Pending';
      if (goal === null || goal === undefined || goal === '') return 'No goal';
      return Number(actual) >= Number(goal) ? 'Above' : (Number(actual) >= Number(goal) * 0.9 ? 'Approaching' : 'Below');
    }
    function renderHome(data, focus) {
      var board = data.board || {};
      var yesterdayBoard = board.yesterday || {};
      var todayBoard = board.today || {};
      var monthBoard = board.month || {};
      function boardMoney(value) {
        if (value === null || value === undefined || value === '') return 'Data Pending';
        return money(value);
      }
      function signedMoney(value) {
        if (value === null || value === undefined || value === '') return 'Data Pending';
        var number = Number(value);
        if (number > 0) return '+' + money(number);
        return money(number);
      }
      function boardCard(title, figure, note, tone) {
        return '<article class="card"><h2>' + esc(title) + '</h2><p class="figure ' + (tone || '') + '">' + figure + '</p><p class="sub">' + note + '</p></article>';
      }
      function kpiTone(actual, goal, reconcile) {
        if (actual === null || actual === undefined || actual === '') return 'pending';
        if (reconcile) return 'warn';
        if (goal === null || goal === undefined || goal === '') return '';
        var value = Number(actual);
        var target = Number(goal);
        if (value >= target) return 'good';
        if (value >= target * 0.9) return 'warn';
        return 'bad';
      }
      function kpiValue(value, unit) {
        if (value === null || value === undefined || value === '') return 'Data Pending';
        if (unit === 'percent') return percent(value);
        if (unit === 'dollars') return money(value);
        return String(Math.round(Number(value)));
      }
      function boardGoal(value, unit) {
        if (value === null || value === undefined || value === '') return 'Data Pending';
        return kpiValue(value, unit);
      }
      function pointGap(actual, goal) {
        var delta = (Number(actual) - Number(goal)) * 100;
        return (delta >= 0 ? '+' : '') + delta.toFixed(1) + ' pts';
      }
      function countGap(actual, goal) {
        var delta = Number(goal) - Number(actual);
        if (delta > 0) return Math.round(delta) + ' left';
        if (delta < 0) return Math.round(Math.abs(delta)) + ' above';
        return 'At goal';
      }
      function sideGap(row, actual) {
        if (actual === null || actual === undefined || row.goal === null || row.goal === undefined) return 'Data Pending';
        if (row.unit === 'percent') return pointGap(actual, row.goal);
        if (row.unit === 'dollars') return signedMoney(Number(actual) - Number(row.goal));
        return countGap(actual, row.goal);
      }
      function performanceCard(title, actual, perf) {
        if (actual === null || actual === undefined) return boardCard(title, 'Data Pending', 'Report missing. Not counted as zero.', 'pending');
        if (!perf || perf.result === null || perf.result === undefined) return boardCard(title, 'Data Pending', 'Saved goal is not on file.', 'pending');
        return boardCard(title, perf.result, boardMoney(actual) + ' vs goal ' + boardMoney(perf.goal) + ' · ' + percent(perf.achieved) + ' · ' + signedMoney(perf.delta), perf.result === 'HIT' ? 'good' : 'bad');
      }
      function forecast(value, provisional) {
        return (provisional ? 'Provisional forecast ' : 'Forecast ') + boardMoney(value);
      }
      var focusNote = focus === 'written' ? 'Written page uses SNAP.' : focus === 'delivered' ? 'Delivered page uses NWDSR.' : '';
      document.getElementById('header-note').textContent = 'Store ' + data.period + (focusNote ? ' · ' + focusNote : '') + ' · Updated ' + data.updated;
      var kpis = (board.kpis || []).map(function (row) {
        var hasWritten = !(row.written === null || row.written === undefined || row.written === '');
        var hasDelivered = !(row.delivered === null || row.delivered === undefined || row.delivered === '');
        var mainTone = hasWritten ? kpiTone(row.written, row.goal, row.reconcile) : (hasDelivered ? kpiTone(row.delivered, row.goal, false) : 'pending');
        var main = hasWritten ? kpiValue(row.written, row.unit) : (hasDelivered ? kpiValue(row.delivered, row.unit) : 'Data Pending');
        var extra = '';
        if (hasWritten && hasDelivered) extra = '<p class="sub">Delivered <span class="' + kpiTone(row.delivered, row.goal, false) + '">' + kpiValue(row.delivered, row.unit) + '</span></p>';
        else if (!hasWritten && !hasDelivered && row.note) extra = '<p class="sub">' + esc(row.note) + '</p>';
        var gap = hasWritten && hasDelivered ? 'W ' + sideGap(row, row.written) + ' · D ' + sideGap(row, row.delivered) : sideGap(row, hasWritten ? row.written : (hasDelivered ? row.delivered : null));
        var through = row.through ? '<p class="sub">Verified through ' + esc(String(row.through)) + (row.detail ? ' · ' + esc(row.detail) : '') + '</p>' : (row.detail ? '<p class="sub">' + esc(row.detail) + '</p>' : '');
        return '<article class="kpi-card"><h3>' + esc(row.name === 'Closing Ratio' ? 'Closing' : row.name) + '</h3><p class="figure ' + mainTone + '">' + main + '</p>' + extra + '<p class="sub">Goal ' + boardGoal(row.goal, row.unit) + ' · ' + gap + '</p>' + through + '</article>';
      }).join('');
      document.getElementById('screen').innerHTML =
        '<h2 class="section-title">Yesterday\'s results</h2>' +
        '<div class="score-row">' +
        boardCard('Yesterday written', data.yesterday && data.yesterday.missing ? 'Data Pending' : boardMoney(data.yesterday.written), 'SNAP written. Actual written sales. ' + esc(data.yesterday.date), data.yesterday && data.yesterday.missing ? 'pending' : '') +
        boardCard('Yesterday delivered', data.yesterday && (data.yesterday.delivered === null || data.yesterday.delivered === undefined) ? 'Data Pending' : boardMoney(data.yesterday.delivered), 'NWDSR delivered. ' + esc(data.yesterday.date), data.yesterday && (data.yesterday.delivered === null || data.yesterday.delivered === undefined) ? 'pending' : '') +
        performanceCard('Written goal performance', data.yesterday ? data.yesterday.written : null, yesterdayBoard.written) +
        performanceCard('Delivered goal performance', data.yesterday ? data.yesterday.delivered : null, yesterdayBoard.delivered) +
        '</div>' +
        '<h2 class="section-title">Today\'s goals</h2>' +
        '<div class="score-row">' +
        boardCard('Today\'s written goal', boardMoney(todayBoard.written), 'Remaining budget divided by days left.', '') +
        boardCard('Today\'s delivered goal', boardMoney(todayBoard.delivered), 'Remaining budget divided by days left.', '') +
        boardCard('Remaining operating days', todayBoard.daysLeft === null || todayBoard.daysLeft === undefined ? 'Data Pending' : String(todayBoard.daysLeft), 'Including today.', '') +
        boardCard('Goal adjustment', signedMoney(todayBoard.writtenAdjustment), 'Delivered ' + signedMoney(todayBoard.deliveredAdjustment) + ' from the even daily share.', '') +
        '</div>' +
        '<h2 class="section-title">Month-to-date store performance</h2>' +
        '<div class="score-row">' +
        boardCard('Written month to date', boardMoney(monthBoard.written), percent(monthBoard.writtenAchieved) + ' of ' + boardMoney(monthBoard.writtenGoal) + '. SNAP written.', '') +
        boardCard('Delivered month to date', boardMoney(monthBoard.delivered), percent(monthBoard.deliveredAchieved) + ' of ' + boardMoney(monthBoard.deliveredGoal) + '. NWDSR delivered.', '') +
        boardCard('Remaining written', boardMoney(monthBoard.writtenLeft), forecast(monthBoard.writtenForecast, monthBoard.provisional), '') +
        boardCard('Remaining delivered', boardMoney(monthBoard.deliveredLeft), forecast(monthBoard.deliveredForecast, monthBoard.provisional), '') +
        '</div>' +
        '<div class="kpi-head"><h2 class="section-title">Month-to-date store KPIs</h2><div class="kpi-nav"><button type="button" id="kpi-prev">Previous</button><button type="button" id="kpi-next">Next</button></div></div>' +
        '<div class="kpi-strip" id="kpi-strip" tabindex="0">' + kpis + '</div>' +
        '<p class="sub">Store month only. ' + salesStandard + ' Slide sideways for every KPI.</p>';
      var strip = document.getElementById('kpi-strip');
      function moveKpis(direction) { strip.scrollBy({ left: direction * 230, behavior: 'smooth' }); }
      document.getElementById('kpi-prev').addEventListener('click', function () { moveKpis(-1); });
      document.getElementById('kpi-next').addEventListener('click', function () { moveKpis(1); });
      strip.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowRight') moveKpis(1);
        if (event.key === 'ArrowLeft') moveKpis(-1);
      });
    }

    function renderDaily(data) {

    function renderMorning(data) {

        return value === null || value === undefined || value === '';

      function huddleMoney(value) {
        if (pending(value)) return 'Pending Report';

      }
      function cents(value) {
        var number = Number(value);
        var sign = number < 0 ? '-' : '';
        var abs = Math.abs(number);
        var text = Math.round(abs * 100) % 100 === 0 ? abs.toFixed(0) : abs.toFixed(2);
        var parts = text.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return sign + '$' + parts.join('.');

      function signed(value) {

      }
      function gapText(perf) {
        if (!perf || pending(perf.goal) || Number(perf.goal) === 0 || pending(perf.delta)) return '';

        if (Math.abs(pct) < 0.0005) return 'even with the goal';

      }
      function shortDate(iso) {

        var parts = String(iso).slice(0, 10).split('-');
        var month = months[Number(parts[1]) - 1] || '';

      }
      function periodLabel(period) {
        var match = String(period || '').match(/(\d{4}-\d{2}-\d{2})\s+through\s+(\d{4}-\d{2}-\d{2})/);
        if (!match) return '';

      function resultCard(title, perf, source) {

        var tone = perf.result === 'HIT' ? 'good' : 'bad';

      }
      function figureWhen(figure) {
        var scope = figure && figure.scope;
        if (scope === 'yesterday') return 'Yesterday · ' + shortDate(figure.date);
        if (scope === 'latest-daily') return 'Latest verified: ' + shortDate(figure.date);
        if (scope === 'mtd') {
          var period = periodLabel(figure.period);
          var through = figure.date ? 'through ' + shortDate(figure.date) : '';
          return 'Latest verified MTD' + (period ? ' · ' + period : '') + (through ? ' · ' + through : '');
        }
        return '';

      function figureCard(title, figure, detail) {

        if (!figure || figure.scope === 'none' || pending(value)) {
          return '<article class="card"><h2>' + esc(title) + '</h2><p class="awaiting">Awaiting first report</p><p class="sub">' + esc(detail) + '</p></article>';

        var when = figureWhen(figure);
        return '<article class="card"><h2>' + esc(title) + '</h2><p class="figure ' + tone + '">' + percent(value) + '</p><p class="sub">' + esc(when) + gap + (detail ? ' · ' + esc(detail) : '') + '</p></article>';

      document.getElementById('screen').innerHTML =
        '<article class="card"><h2>Shared passwords</h2><p class="sub">Changing a password signs that role out everywhere.</p>' +
        '<label>Role</label><input id="pw-role" value="manager" />' +
        '<label>New password</label><input id="pw-value" type="password" />' +
        '<p id="pw-error" class="error"></p><p class="noprint"><button id="pw-save" type="button">Save password</button> <button id="retry" type="button">Retry imports</button></p></article>';
      document.getElementById('pw-save').addEventListener('click', function () {
        api('changePassword', { role: document.getElementById('pw-role').value, password: document.getElementById('pw-value').value }).then(function (result) {
          if (result.token) { token = result.token; sessionStorage.setItem('cc-token', token); }
          document.getElementById('pw-error').textContent = 'Password saved.';
        }).catch(function (error) {
          if (/sign in/i.test(error.message)) showLogin(error.message);
          else document.getElementById('pw-error').textContent = error.message;
        });
      });
      document.getElementById('retry').addEventListener('click', function () {
        api('retry').then(function () { openScreen('health'); }).catch(function (error) { document.getElementById('pw-error').textContent = error.message; });
      });
    }
    function na(value) {
      return value === null || value === undefined || value === '' ? 'Not Available' : value;
    }
    function goalLabel(value, unit) {
      if (value === null || value === undefined || value === '') return 'Not configured';
      if (unit === 'percent') return percent(value);
      if (unit === 'dollars') return money(value);
      return String(value);
    }
    function beddingSortKey(person, key) {
      var value = person[key];
      return value === null || value === undefined ? null : Number(value);
    }
    var beddingSort = 'name';
    var beddingCache = null;
    function renderBedding(data) {
      beddingCache = data;
      document.getElementById('header-note').textContent = 'Bedding · Updated ' + data.updated;
      drawBedding();
    }
    function drawBedding() {
      var data = beddingCache;
      var people = (data.people || []).slice().sort(function (left, right) {
        if (beddingSort === 'name') return left.name.localeCompare(right.name);
        var a = beddingSortKey(left, beddingSort);
        var b = beddingSortKey(right, beddingSort);
        if (a === null) return 1;
        if (b === null) return -1;
        return b - a;
      });
      var rows = people.map(function (person) {
        return '<tr><td><button class="linkish" type="button" data-bed="' + esc(person.name) + '">' + esc(person.name) + '</button></td><td>' + money(person.mattressWritten) + '</td><td>' + money(person.mattressDelivered) + '</td><td>' + percent(person.writtenPercent) + '</td><td>' + percent(person.deliveredPercent) + '</td><td>' + na(person.units) + '</td><td>' + percent(person.protectorPercent) + '</td><td>' + na(person.protectorUnits) + '</td><td>' + na(person.pillowUnits) + '</td><td>' + money(person.pillowDollars) + '</td><td>' + na(person.baseUnits) + '</td><td>' + money(person.baseDollars) + '</td><td>' + percent(person.basePercent) + '</td></tr>';
      }).join('');
      var admin = data.role === 'admin'
        ? '<article class="card noprint" style="margin-top:12px"><h2>Pillow and adjustable-base goals</h2><p class="sub">Official goals are pillows 65% and adjustable bases 35%. An admin can replace them. Enter a percent as 65 for 65%. Bedding stays 20% and protectors stay 80%.</p><label>Pillow goal</label><input id="pillow-goal" value="" /><label>Pillow unit</label><input id="pillow-unit" value="' + esc(data.pillowUnit || 'percent') + '" /><label>Adjustable base goal</label><input id="base-goal" value="" /><label>Adjustable base unit</label><input id="base-unit" value="' + esc(data.baseUnit || 'percent') + '" /><p id="bed-goal-note" class="error"></p><button id="save-bed-goals" type="button">Save goals</button></article>'
        : '';
      document.getElementById('screen').innerHTML =
        '<div class="bedding-page" id="bedding-dashboard">' +
        '<h2 class="section-title">Store mattress sales</h2><p class="sub">Store reporting period ' + esc(data.storePeriod) + '</p>' +
        '<div class="grid bedding-band">' +
        card('Mattress sales written', 'Not Available', 'Mattress dollars are not on a verified store-month report.') +
        card('Mattress sales delivered', 'Not Available', 'Delivered mattress dollars are not on file.') +
        card('Bedding written %', percent(data.writtenPercent), data.writtenPercentNote || 'Goal 20%. Written bedding dollars divided by written sales for this store month.', toneFor(data.writtenPercent, data.beddingGoal)) +
        card('Bedding delivered %', 'Not Available', 'Delivered bedding is not copied from the written figure. Goal 20%.') +
        card('Bedding goal', percent(data.beddingGoal), 'Official bedding minimum.') +
        card('Written mattress units', 'Not Available', 'Unit counts are not on the daily sales reports.') +
        card('Delivered mattress units', 'Not Available', 'Unit counts are not on the daily sales reports.') +
        card('Average mattress price', 'Not Available', 'Needs mattress dollars and mattress units for the same side.') +
        card('Versus last year', 'Not Available', 'A prior-year bedding report for this store period is not on file.') +
        '</div>' +
        '<h2 class="section-title">Store bedding attachments</h2>' +
        '<div class="grid bedding-band">' +
        card('Protectors written', 'Not Available', 'Units and dollars. Goal ' + percent(data.protectorGoal) + ' attachment. Not divided by store sales.') +
        card('Protectors delivered', 'Not Available', 'Delivered protector units and dollars are not on file.') +
        card('Protector attachment', 'Not Available', 'Needs eligible mattress opportunities and actual attachments for the store month.') +
        card('Pillows written', 'Not Available', 'Units and dollars. Pillows are not included in the bedding percentage. Goal ' + goalLabel(data.pillowGoal, data.pillowUnit) + '.') +
        card('Pillows delivered', 'Not Available', 'Delivered pillow units and dollars are not on file.') +
        card('Pillows per mattress', 'Not Available', 'Needs pillow units and mattress sales for the same side.') +
        card('Adjustable bases written', 'Not Available', 'Units and dollars. Goal ' + goalLabel(data.baseGoal, data.baseUnit) + '.') +
        card('Adjustable bases delivered', 'Not Available', 'Delivered adjustable-base units and dollars are not on file.') +
        card('Adjustable base attachment', 'Not Available', 'Needs eligible opportunities. Packaged bases are not counted twice.') +
        '</div>' +
        '<article class="card kpi-wrap" style="margin-top:12px"><h2>Store KPI scoreboard</h2><table class="kpi"><tr><th>KPI</th><th>Written</th><th>Delivered</th><th>Goal</th></tr>' +
        '<tr><td>Bedding sales $</td><td>Not Available</td><td>Not Available</td><td>—</td></tr>' +
        '<tr><td>Bedding %</td><td class="' + toneFor(data.writtenPercent, data.beddingGoal) + '">' + percent(data.writtenPercent) + '</td><td>Not Available</td><td>' + percent(data.beddingGoal) + '</td></tr>' +
        '<tr><td>Mattress units</td><td>Not Available</td><td>Not Available</td><td>—</td></tr>' +
        '<tr><td>Mattress protectors</td><td>Not Available</td><td>Not Available</td><td>' + percent(data.protectorGoal) + ' attachment</td></tr>' +
        '<tr><td>Pillows</td><td>Not Available</td><td>Not Available</td><td>' + goalLabel(data.pillowGoal, data.pillowUnit) + '</td></tr>' +
        '<tr><td>Adjustable bases</td><td>Not Available</td><td>Not Available</td><td>' + goalLabel(data.baseGoal, data.baseUnit) + '</td></tr>' +
        '</table><p class="sub">Green is at or above a confirmed goal. Amber is approaching. Red is below a confirmed figure. A missing source stays Not Available.</p>' +
        '<p class="noprint"><button id="print-bedding" type="button">Print store bedding report</button></p></article>' +
        '<h2 class="section-title">Salesperson bedding performance</h2><p class="sub">Salesperson reporting period ' + esc(data.individualPeriod) + '. These dates are not the store month, so the rows are not expected to add up to the store total.</p>' +
        '<div class="nav noprint"><button class="sort" type="button" data-bed-sort="name">Name</button><button class="sort" type="button" data-bed-sort="mattressWritten">Written $</button><button class="sort" type="button" data-bed-sort="writtenPercent">Written %</button><button class="sort" type="button" data-bed-sort="protectorPercent">Protector %</button></div>' +
        '<article class="card kpi-wrap"><table class="kpi"><tr><th>Salesperson</th><th>Mattress written $</th><th>Mattress delivered $</th><th>Written %</th><th>Delivered %</th><th>Units</th><th>Protector %</th><th>Protector units</th><th>Pillow units</th><th>Pillow $</th><th>Base units</th><th>Base $</th><th>Base %</th></tr>' + rows + '</table><p class="sub">No daily report on file breaks out mattress dollars, protector attachments, pillows, or adjustable bases by salesperson. Nothing above is shown as zero.</p></article>' +
        admin +
        '</div>';
      var printButton = document.getElementById('print-bedding');
      if (printButton) printButton.addEventListener('click', function () { window.print(); });
      document.querySelectorAll('[data-bed-sort]').forEach(function (button) {
        if (button.getAttribute('data-bed-sort') === beddingSort) button.className = 'sort active';
        button.addEventListener('click', function () { beddingSort = button.getAttribute('data-bed-sort'); drawBedding(); });
      });
      document.querySelectorAll('[data-bed]').forEach(function (button) {
        button.addEventListener('click', function () { renderBeddingPerson(button.getAttribute('data-bed')); });
      });
      var save = document.getElementById('save-bed-goals');
      if (save) save.addEventListener('click', function () {
        api('saveBeddingGoals', {
          pillowGoal: document.getElementById('pillow-goal').value,
          pillowUnit: document.getElementById('pillow-unit').value,
          baseGoal: document.getElementById('base-goal').value,
          baseUnit: document.getElementById('base-unit').value,
        }).then(function (next) {
          beddingCache = next;
          drawBedding();
        }).catch(function (error) {
          if (/sign in/i.test(error.message)) showLogin(error.message);
          else document.getElementById('bed-goal-note').textContent = error.message;
        });
      });
    }
    function renderBeddingPerson(name) {
      var person = (beddingCache.people || []).filter(function (item) { return item.name === name; })[0];
      if (!person) return;
      document.getElementById('screen').innerHTML =
        '<div class="bedding-page"><p class="noprint"><button class="linkish" id="back-bedding" type="button">All bedding</button></p>' +
        '<h2 class="section-title">' + esc(person.name) + '</h2><p class="sub">Salesperson period ' + esc(beddingCache.individualPeriod) + '</p>' +
        '<div class="grid bedding-band">' +
        card('Mattress written $', money(person.mattressWritten), 'Not taken from SNAP store written.') +
        card('Mattress delivered $', money(person.mattressDelivered), 'Not copied from written.') +
        card('Bedding written %', percent(person.writtenPercent), 'Goal 20%.') +
        card('Bedding delivered %', percent(person.deliveredPercent), 'Goal 20%.') +
        card('Protector attachment', percent(person.protectorPercent), 'Goal ' + percent(beddingCache.protectorGoal) + ' of eligible mattress opportunities.') +
        card('Protector units', na(person.protectorUnits), '') +
        card('Pillow units', na(person.pillowUnits), '') +
        card('Pillow sales', money(person.pillowDollars), 'Not part of the bedding percentage.') +
        card('Adjustable base units', na(person.baseUnits), '') +
        card('Adjustable base sales', money(person.baseDollars), '') +
        card('Adjustable base attachment', percent(person.basePercent), 'Goal ' + goalLabel(beddingCache.baseGoal, beddingCache.baseUnit) + '.') +
        '</div><article class="card" style="margin-top:12px"><h2>Strengths and opportunities</h2><p>No verified mattress, protector, pillow, or adjustable-base lines are on file for this salesperson, so strengths are not ranked.</p><p class="noprint"><button id="print-person-bedding" type="button">Print individual bedding report</button></p></article></div>';
      document.getElementById('back-bedding').addEventListener('click', function () { drawBedding(); });
      document.getElementById('print-person-bedding').addEventListener('click', function () { window.print(); });
    }
    function renderCoverage(data) {
      var rows = (data.rows || []).map(function (row) {
        return '<tr><td>' + esc(row.report) + '</td><td>' + esc(row.earliest || '—') + '</td><td>' + esc(row.latest || '—') + '</td><td>' + esc(row.dailyRecords) + '</td><td>' + esc(row.missing) + '</td><td>' + esc(row.sheets) + '</td></tr>';
      }).join('');
      document.getElementById('header-note').textContent = 'Data coverage · store days October 2 through October 13';
      document.getElementById('screen').innerHTML =
        '<article class="card kpi-wrap"><h2>Historical report coverage</h2><p class="sub">' + salesStandard + ' A cumulative snapshot is not counted as a daily result. October 14 is still open, so it is not listed as missing.</p><table class="kpi"><tr><th>Report</th><th>Earliest</th><th>Latest</th><th>Daily records</th><th>Missing daily dates</th><th>In Google Sheets</th></tr>' + rows + '</table></article>';
    }
    function openScreen(name) {
      screen = name;
      drawNav();
      var request = name === 'written' || name === 'delivered' || name === 'orders' ? 'home' : name;
      if (name === 'admin') { renderAdmin(); return; }
      api(request).then(function (data) {
        if (name === 'home' || name === 'written' || name === 'delivered') renderHome(data, name);
        else if (name === 'bedding') renderBedding(data);
        else if (name === 'orders') {
          document.getElementById('header-note').textContent = data.period + ' · Updated ' + data.updated;
          document.getElementById('screen').innerHTML = card('Open orders and backorders', 'Not Available', 'No open-order report is on file. Nothing is shown as zero.');
        } else if (name === 'daily') renderDaily(data);
        else if (name === 'people') renderPeople(data);
        else if (name === 'morning') renderMorning(data);
        else if (name === 'health') renderHealth(data);
        else if (name === 'coverage') renderCoverage(data);
      }).catch(function (error) {
        if (/sign in/i.test(error.message)) showLogin(error.message);
        else document.getElementById('screen').innerHTML = '<p class="error">' + error.message + '</p>';
      });
    }
    document.getElementById('signin').addEventListener('click', function () {
      document.getElementById('login-error').textContent = '';
      api('login', { username: document.getElementById('username').value, password: document.getElementById('password').value }).then(function (result) {
        token = result.token;
        role = result.role;
        sessionStorage.setItem('cc-token', token);
        sessionStorage.setItem('cc-role', role);
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        openScreen('home');
      }).catch(function (error) { document.getElementById('login-error').textContent = error.message; });
    });
    token = sessionStorage.getItem('cc-token') || '';
    role = sessionStorage.getItem('cc-role') || '';
    if (token && role) {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      openScreen('home');
    }
  </script>
</body>
</html>
